packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  better-sqlite3: true
  # fabric's optional Node.js canvas backend; not needed for browser-only usage in kiosk-operator-app
  canvas: false
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  # Local (offline) AI-stylization fallback (hybrid Pollinations + local
  # models) — needs its postinstall to fetch the prebuilt native binary.
  onnxruntime-node: true
  # onnxruntime-web's transitive dep, pulled in by @imgly/background-removal
  # (Этап 9, ИИ-раздел) — same rationale as the other native/build-script
  # deps above (esbuild, better-sqlite3, etc.): trusted, needed to build.
  protobufjs: true
