# Oracle Always Free / VPS: Postgres + central-relay + Caddy (HTTPS).
# Build context is the monorepo root (two levels up).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tshirt_central}
      POSTGRES_USER: ${POSTGRES_USER:-tshirt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tshirt} -d ${POSTGRES_DB:-tshirt_central}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  relay:
    # Prefer prebuilt image on Always Free Micro (1 GB) — `docker compose build` OOMs.
    # Rebuild locally: `docker compose build relay` then `docker save/load` to the VM.
    image: oracle-relay:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER:-tshirt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tshirt_central}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.kyoma.uk}
      DEFAULT_ADMIN_LOGIN: ${DEFAULT_ADMIN_LOGIN:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
      MIGRATE_ON_START: "1"
      SEED_ON_START: "1"
      ADMIN_DIST_PATH: /app/admin-dist
    volumes:
      - relay_data:/app/data
    networks:
      - internal
      - edge
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-api.kyoma.uk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  postgres_data:
  relay_data:
  caddy_data:
  caddy_config:

networks:
  internal:
  edge:
