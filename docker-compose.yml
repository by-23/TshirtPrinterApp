services:
  postgres:
    image: postgres:16-alpine
    container_name: tshirt-central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tshirt_central
      POSTGRES_USER: tshirt
      POSTGRES_PASSWORD: tshirt
    ports:
      - "5432:5432"
    volumes:
      - tshirt_central_postgres_data:/var/lib/postgresql/data

volumes:
  tshirt_central_postgres_data:
